# CXPalm web control, independent downloads and authenticated API.
location = /cxpalm { return 308 /cxpalm/; }
location = /cxpalm/ {
    root /srv/cxpalm-web;
    try_files /index.html =404;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' wss://cxpalm.example.com; img-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    limit_except GET { deny all; }
}
location ^~ /cxpalm/assets/ {
    alias /srv/cxpalm-web/;
    autoindex off;
    types {
        application/javascript mjs;
        text/css css;
        image/svg+xml svg;
    }
    default_type application/octet-stream;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' wss://cxpalm.example.com; img-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    limit_except GET { deny all; }
}
location = /cxpalm/download.html {
    alias /srv/cxpalm/index.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    limit_except GET { deny all; }
}
location ^~ /cxpalm/ {
    alias /srv/cxpalm/;
    index index.html;
    autoindex off;
    types {
        text/html html;
        text/plain txt;
        application/json json;
        application/vnd.android.package-archive apk;
        image/svg+xml svg;
    }
    default_type application/octet-stream;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    limit_except GET { deny all; }
}
location ^~ /api/v1/ {
    proxy_pass http://127.0.0.1:18791;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Proto https;
    # Always overwrite caller-supplied values before the loopback SSH tunnel.
    proxy_set_header X-CXPalm-Client-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $cmb_win_connection;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_next_upstream off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 5s;
    client_max_body_size 20m;
}
